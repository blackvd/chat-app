# Backend (Express + Socket.io) for NouchiChat. The Netlify frontend proxies to this service.
services:
  - type: web
    name: nouchichat-api
    runtime: node
    plan: free
    # NODE_ENV=production makes npm skip devDependencies; Vite is one and is needed to build.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: MONGODB_URI
        sync: false
